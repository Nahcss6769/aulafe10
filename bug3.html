
<div class="demo-gravar">
  <h3>Gravar tema</h3>

  <label for="tema">Valor do tema</label>

  <input type="text" id="tema" value="escuro">

  <button onclick="gravarTema()">Gravar tema</button>

  <div class="terminal" id="demo-gravar-resultado"></div>
</div>

<style>
.demo-gravar {
  background: #ffffff;
  border: 2px solid #e2e8f0;
  border-radius: 12px;
  padding: 20px;
  max-width: 480px;
}

.demo-gravar h3 {
  font-size: 1rem;
  margin-bottom: 10px;
  color: #1e1b4b;
}

.demo-gravar label {
  display: block;
  font-weight: 700;
  font-size: 0.82rem;
  color: #334155;
  margin-bottom: 4px;
}

.demo-gravar input {
  box-sizing: border-box;
  width: 100%;
  padding: 9px 12px;
  border: 1px solid #cbd5e1;
  border-radius: 6px;
  font-size: 0.9rem;
  margin-bottom: 8px;
}

.demo-gravar button {
  background: #7c3aed;
  color: #ffffff;
  border: none;
  padding: 9px 18px;
  border-radius: 8px;
  font-weight: 700;
  cursor: pointer;
  font-size: 0.85rem;
  margin-bottom: 10px;
}

.demo-gravar button:hover {
  background: #6d28d9;
}

.demo-gravar .terminal {
  background: #0b0518;
  color: #a5f3fc;
  padding: 10px 14px;
  border-radius: 8px;
  font-family: 'Courier New', monospace;
  font-size: 0.78rem;
  min-height: 40px;
  word-break: break-all;
}
</style>

<script>
function gravarTema() {
  var valor = document.getElementById("tema").value;

  if (!valor.trim()) {
    document.getElementById("demo-gravar-resultado").textContent =
      "Digite um tema antes de gravar.";
    return;
  }

  document.cookie =
    "tema=" + encodeURIComponent(valor) +
    "; max-age=3600; path=/; SameSite=Lax";

  document.getElementById("demo-gravar-resultado").textContent =
    "Cookie tema=" + valor + " gravado com sucesso!";
}
</script>
